<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Finalizare comandă | RIXAIR</title><meta property="og:title" content="Finalizare comandă | RIXAIR"/>
<link href="https://fonts.googleapis.com/css2?family=Signika:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>
<style>
:root{--rx:#1583ab;--rx2:#0f6a8b;--gold:#f4c340}
*{box-sizing:border-box}
body{font-family:'Signika',sans-serif;background:#f4f7f9;color:#243;margin:0;padding:20px}
.wrap{max-width:920px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.top a{color:var(--rx);text-decoration:none;font-weight:600;font-size:14px}
h1{font-size:24px;margin:0 0 4px}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(20,60,90,.07);padding:22px}
.sum h2{font-size:16px;margin:0 0 12px;color:var(--rx)}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eef2f5;font-size:14px}
.li small{color:#789;display:block}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin-top:14px}
.tot .tva{font-size:12px;color:#789;font-weight:400}
#pay-btn{margin-top:18px;width:100%;background:var(--gold);color:#222;border:0;border-radius:26px;padding:15px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
#pay-btn:disabled{opacity:.6;cursor:default}
.muted{font-size:12px;color:#8a99a3;margin-top:12px;text-align:center}
.err{background:#fdecea;color:#b3261e;border-radius:10px;padding:12px;font-size:14px;margin-top:14px;display:none}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
.lbl{font-size:13px;font-weight:600;color:#456;margin-bottom:6px}
.in{width:100%;font-family:inherit;font-size:15px;padding:11px 12px;border:1px solid #d7e0e6;border-radius:8px;background:#fff;color:#243}
.in:focus{outline:none;border-color:var(--rx);box-shadow:0 0 0 3px rgba(21,131,171,.12)}
.in.bad{border-color:#e0857d;background:#fff7f6}
.secure{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#789;margin-top:10px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.load{padding:40px;text-align:center;color:#789}
</style></head>
<body><div class="wrap">
<div class="top"><a href="/cos-de-cumparaturi">&#8592; Înapoi la coș</a></div>
<h1>Finalizare comandă</h1>
<p style="margin:0 0 18px;color:#678;font-size:14px">Plată securizată cu cardul prin Stripe · livrare în toată România</p>
<div class="grid">
  <div class="card">
    <div id="pay-area"><div class="load"><span class="spin" style="border-color:#1583ab;border-top-color:transparent"></span> Se pregătește plata…</div></div>
    <div class="err" id="err"></div>
  </div>
  <div class="card sum">
    <h2>Comanda ta</h2>
    <div id="items"></div>
    <div class="tot"><span>Total</span><span id="total">—</span></div>
    <div class="tva">Prețuri cu TVA inclus (21%)</div>
    <div class="secure">🔒 Date card criptate · 3-D Secure</div>
  </div>
</div>
<p class="muted">RIXAR IMOB S.R.L. · CUI RO40039921 · 0722 975 518 · office@rixar.ro</p>
</div>

<script>
var FN='https://uyynocwfvwmgttckgvzu.supabase.co/functions/v1/create-payment-intent';
var SUCCESS=location.origin+'/plata-reusita.html';
var JUDETE=["Alba","Arad","Argeș","Bacău","Bihor","Bistrița-Năsăud","Botoșani","Brașov","Brăila","București","Buzău","Caraș-Severin","Călărași","Cluj","Constanța","Covasna","Dâmbovița","Dolj","Galați","Giurgiu","Gorj","Harghita","Hunedoara","Ialomița","Iași","Ilfov","Maramureș","Mehedinți","Mureș","Neamț","Olt","Prahova","Satu Mare","Sălaj","Sibiu","Suceava","Teleorman","Timiș","Tulcea","Vaslui","Vâlcea","Vrancea"];
function lei(n){return (n==null||isNaN(n))?'—':Number(n).toLocaleString('ro-RO',{minimumFractionDigits:(n%1===0)?0:2,maximumFractionDigits:2})+' Lei';}
function cart(){try{return JSON.parse(localStorage.getItem('rx_cerere')||'[]')}catch(e){return[]}}
function showErr(m){var e=document.getElementById('err');e.textContent=m;e.style.display='block';e.scrollIntoView({behavior:'smooth',block:'center'});}

(function(){
  var l=cart();
  var items=document.getElementById('items');
  if(!l.length){
    document.getElementById('pay-area').innerHTML='<p>Coșul e gol. <a href="/" style="color:#1583ab;font-weight:600">Mergi la catalog</a></p>';
    items.innerHTML='<p style="color:#789;font-size:14px">Niciun produs.</p>';return;
  }
  var allPriced=l.every(function(i){return i.pret;});
  items.innerHTML=l.map(function(i){return '<div class="li"><span>'+i.nume+(i.varianta?'<small>'+i.varianta+'</small>':'')+'<small>cod: '+i.sku+' × '+i.qty+'</small></span><span>'+lei(i.pret?i.pret*i.qty:null)+'</span></div>';}).join('');
  if(!allPriced){
    document.getElementById('pay-area').innerHTML='<p>Unele produse au preț la cerere — pentru ele te rugăm <a href="/cos-de-cumparaturi" style="color:#1583ab;font-weight:600">trimite cererea pe email</a>.</p>';
    return;
  }

  var payload={items:l.map(function(i){return {sku:i.sku,qty:i.qty};}), email:(localStorage.getItem('rx_email')||undefined)};
  fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
   .then(function(r){return r.json();})
   .then(function(d){
     if(d.error) throw new Error(d.error);
     if(!d.publishableKey) throw new Error('Cheia Stripe (publishable) nu este configurată încă pe server.');
     document.getElementById('total').textContent=lei(d.total);
     mountStripe(d.publishableKey, d.clientSecret);
   })
   .catch(function(e){
     document.getElementById('pay-area').innerHTML='';
     showErr('Plata nu a putut porni: '+e.message+' Poți reveni la coș și trimite cererea pe email.');
   });

  function mountStripe(pk, clientSecret){
    var stripe=Stripe(pk);
    var appearance={theme:'stripe',variables:{colorPrimary:'#1583ab',fontFamily:'Signika, sans-serif',borderRadius:'10px'}};
    var elements=stripe.elements({clientSecret:clientSecret, appearance:appearance, locale:'ro'});
    var jOpts='<option value="">Alege județul…</option>'+JUDETE.map(function(j){return '<option>'+j+'</option>';}).join('');
    document.getElementById('pay-area').innerHTML=
      '<div class="field"><div class="lbl">Email</div><input class="in" id="f-email" type="email" placeholder="adresa@exemplu.ro" value="'+(localStorage.getItem('rx_email')||'')+'"></div>'+
      '<div class="row2"><div class="field"><div class="lbl">Nume complet</div><input class="in" id="f-nume" placeholder="Prenume Nume"></div>'+
      '<div class="field"><div class="lbl">Telefon</div><input class="in" id="f-tel" type="tel" placeholder="07xx xxx xxx"></div></div>'+
      '<div class="row2"><div class="field"><div class="lbl">Județ</div><select class="in" id="f-judet">'+jOpts+'</select></div>'+
      '<div class="field"><div class="lbl">Localitate</div><input class="in" id="f-oras" placeholder="Oraș / comună"></div></div>'+
      '<div class="row2"><div class="field"><div class="lbl">Adresă (stradă, număr)</div><input class="in" id="f-adresa" placeholder="Str. ... nr. ..."></div>'+
      '<div class="field"><div class="lbl">Cod poștal</div><input class="in" id="f-cod" placeholder="opțional"></div></div>'+
      '<div class="field"><div class="lbl">Date card</div><div id="el-payment"></div></div>'+
      '<button id="pay-btn">Plătește în siguranță</button>';
    var payEl=elements.create('payment',{layout:'tabs',fields:{billingDetails:{name:'never',email:'never',phone:'never',address:'never'}}});
    payEl.mount('#el-payment');

    function val(id){return (document.getElementById(id).value||'').trim();}
    function mark(id,ok){document.getElementById(id).classList.toggle('bad',!ok);}
    document.getElementById('pay-btn').addEventListener('click',function(){
      var btn=this;
      var email=val('f-email'),nume=val('f-nume'),tel=val('f-tel'),judet=val('f-judet'),oras=val('f-oras'),adresa=val('f-adresa'),cod=val('f-cod');
      var okE=/.+@.+\..+/.test(email);mark('f-email',okE);mark('f-nume',!!nume);mark('f-tel',tel.length>=6);mark('f-judet',!!judet);mark('f-oras',!!oras);mark('f-adresa',!!adresa);
      if(!(okE&&nume&&tel.length>=6&&judet&&oras&&adresa)){showErr('Te rugăm completează email, nume, telefon, județ, localitate și adresă.');return;}
      try{localStorage.setItem('rx_email',email);}catch(e){}
      btn.disabled=true;btn.innerHTML='<span class="spin"></span>Se procesează…';
      document.getElementById('err').style.display='none';
      var det={name:nume,email:email,phone:tel,address:{country:'RO',state:judet,city:oras,line1:adresa,postal_code:cod||undefined}};
      stripe.confirmPayment({elements:elements,confirmParams:{return_url:SUCCESS,payment_method_data:{billing_details:det},shipping:{name:nume,phone:tel,address:{country:'RO',state:judet,city:oras,line1:adresa,postal_code:cod||undefined}}}})
       .then(function(res){
         if(res.error){btn.disabled=false;btn.textContent='Plătește în siguranță';showErr(res.error.message||'Plata a fost respinsă.');}
       });
    });
  }
})();
</script>
</body></html>
